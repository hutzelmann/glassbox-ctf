schema: spec-driven

context: |
  glassbox-ctf: self-contained, Dockerized web-security teaching challenges
  (SQL injection, XSS today; scope will grow to other domains, e.g. binary).
  Educational / defensive: textbook OWASP-class bugs, fictional flags, fully
  offline containers. No test suite; a challenge is exercised by building its
  container and clicking through it in a browser. Local dev uses podman; CI uses
  docker buildx and publishes to ghcr.io/<owner>/glassbox-ctf-<name>.

  Two learner mechanisms drive the design:
  - the critical.<ext> pattern: the single vulnerable snippet lives in
    critical.php (snapshotted to critical.orig.php at build), require'd by a page;
    an in-browser CodeMirror editor (fix.php) saves it back so the learner patches
    the real running code.
  - the ?debug=1 switch: sticky toggle exposing server internals (exact SQL,
    returned rows, admin's rendered page, JS errors).

  AGENTS.md is the single source of truth for repository conventions.

