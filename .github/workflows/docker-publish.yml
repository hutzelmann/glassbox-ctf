name: Build and publish Docker images

on:
  push:
    branches:
      - main

# Pipeline shape:
#   discover  -> scan challenges/**/Dockerfile, emit a JSON matrix (no hand-kept list)
#   base      -> build the platform chain in dependency order: harness, then php
#   challenges-> build every discovered challenge FROM its parsed family base
env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Auto-discover challenges. Adding a challenge = adding its folder; no edit here.
  # For each challenges/<domain>/<name>/Dockerfile we emit {name, path, base}:
  #   - name: the folder basename -> published as glassbox-ctf-<name> (flat, path-independent)
  #   - base: the CI override for the Dockerfile's `ARG BASE_IMAGE` default, mapped to its
  #           GHCR family image (glassbox-php -> ghcr.io/<owner>/glassbox-ctf-php:latest).
  #           Empty for standalone images (e.g. runtime-check FROM alpine).
  #   - platforms: the `LABEL org.glassbox.platforms` default (e.g. binary rungs pin
  #           linux/amd64 so their x86-64 addresses match the walkthrough), or the
  #           two-arch default when the label is absent.
  # ---------------------------------------------------------------------------
  discover:
    name: Discover challenges
    runs-on: ubuntu-latest
    outputs:
      challenges: ${{ steps.scan.outputs.challenges }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan for challenge Dockerfiles
        id: scan
        run: |
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          items=()
          for df in challenges/*/*/Dockerfile; do
            [ -f "$df" ] || continue
            dir="$(dirname "$df")"
            name="$(basename "$dir")"
            # The default of `ARG BASE_IMAGE=<local-name>`, if any (e.g. glassbox-php).
            base_local="$(grep -oP '^ARG[[:space:]]+BASE_IMAGE=\K[^[:space:]]+' "$df" | head -n1 || true)"
            if [[ "$base_local" == glassbox-* ]]; then
              family="${base_local#glassbox-}"                        # php, native, ...
              base="${REGISTRY}/${owner}/${repo}-${family}:latest"
            else
              base=""                                                 # standalone (no glassbox base)
            fi
            # Optional per-challenge publish platforms (LABEL org.glassbox.platforms).
            platforms="$(grep -oP '^LABEL[[:space:]]+org\.glassbox\.platforms=\"?\K[^\"]+' "$df" | head -n1 || true)"
            [ -z "$platforms" ] && platforms="linux/amd64,linux/arm64"
            items+=("{\"name\":\"${name}\",\"path\":\"${dir}\",\"base\":\"${base}\",\"platforms\":\"${platforms}\"}")
          done
          json="[$(IFS=,; echo "${items[*]}")]"
          echo "Discovered: $json"
          echo "challenges=${json}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Platform base chain. harness first, then families FROM harness.
  # A new family (e.g. native) is added here as a sibling step that `needs` harness.
  # ---------------------------------------------------------------------------
  base:
    name: Build base chain
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker setup
        uses: ./.github/actions/docker-setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push harness
        uses: docker/build-push-action@v7
        with:
          context: ./platform/harness
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}-harness:latest

      - name: Build and push php family
        uses: docker/build-push-action@v7
        with:
          context: ./platform/php
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}-php:latest
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}-harness:latest

      - name: Build and push native family
        uses: docker/build-push-action@v7
        with:
          context: ./platform/native
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}-native:latest
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}-harness:latest

  # ---------------------------------------------------------------------------
  # Build every discovered challenge, FROM its parsed family base (or standalone).
  # ---------------------------------------------------------------------------
  challenges:
    name: Build ${{ matrix.item.name }}
    runs-on: ubuntu-latest
    needs: [discover, base]
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.challenges) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker setup
        uses: ./.github/actions/docker-setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.item.name }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.item.path }}
          push: true
          platforms: ${{ matrix.item.platforms }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.item.name }}:latest
          build-args: ${{ matrix.item.base != '' && format('BASE_IMAGE={0}', matrix.item.base) || '' }}
